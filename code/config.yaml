# RAG 시스템 설정 파일
# 이 파일을 수정하여 모델, 검색 파라미터 등을 조정할 수 있습니다.

# LLM 설정 (모든 모델 통합 관리)
llm:
  router:
    model: "solar-pro2"          # 라우팅 분류용 모델
    temperature: 0.1             # 라우터용 temperature (낮을수록 일관성 높음)
  general:
    model: "solar-pro2"          # 일반답변용 모델
    temperature: 0.7             # 일반답변용 temperature
  rag:
    model: "solar-pro2"          # RAG 답변용 모델
    temperature: 0.7             # RAG 답변용 temperature
    reasoning_effort: "high"     # RAG용 reasoning (solar-pro2만)

# 임베딩 설정
embeddings:
  model: "embedding-query"       # 임베딩 모델

# Retriever 설정 (문서 검색)
retriever:
  search_type: "similarity"      # 검색 방법: similarity, mmr, similarity_score_threshold
  top_k: 5                       # 반환할 문서 수 (상위 k개)
  score_threshold: 0.8           # similarity_score_threshold일 때 최소 점수
  
# 벡터스토어 설정
vectorstore:
  chunk_size: 1000               # 문서 청크 크기
  chunk_overlap: 50              # 청크 간 겹치는 부분

# 시스템 로그 설정
logging:
  level: "INFO"                  # DEBUG, INFO, WARNING, ERROR
  
# 데이터베이스 설정
database:
  conversation_limit: 20         # 사이드바에 표시할 대화 수
  memory_window: 3               # 최근 대화 메모리 창 크기 (대화 쌍 기준)
